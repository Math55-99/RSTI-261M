<!DOCTYPE html>

<html>

<head>
    <title> Calculadora </title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/main.css">
</head>

<body>
    <header class="header">
        <h1 id="name">Calculus - Math</h1>
        <img src="img/imagem - 01.png" alt="Calculator" id="calculation">
    </header>

    <section class="cal">
        <h1 class="cal__result">0</h1>

        <div class="digitar">
            <input type="number" id="num1">
            <input type="number" id="num2">
        </div>

        <div class="button">
            <button class="button__addition">+</button>
            <button class="button__subtraction">-</button>
            <button class="button__multiplication">*</button>
            <button class="button__division">/</button>
            <button class="button__percent">%</button>
        </div>

        <button id="reset">Clea</button>
    </section>
  <script src="js/script.js"></script>
</body>

</html>
