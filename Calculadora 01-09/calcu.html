<!DOCTYPE html>

<html>

<head>
    <title> Calculadora </title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="header">
        <h1 id="name">Calculus - Math</h1>
        <img src="imagem - 01.png" alt="Calculator" id="calculation">
    </header>
    <section class="cal">
        <h1 class="result">0</h1>

        <div class="digitar">
            <input type="number" id="num1">
            <input type="number" id="num2">
        </div>

        <div class="button">
            <button id="addition">+</button>
            <button id="subtraction">-</button>
            <button id="multiplication">*</button>
            <button id="division">/</button>
            <button id="percent">%</button>
        </div>

        <button id="reset">Clea</button>
    </section>
    <script src="script.js"></script>
</body>

</html>
